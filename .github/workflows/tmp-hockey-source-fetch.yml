name: Temporary Hockey Worlds source fetch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch targeted public roster sources
        shell: bash
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, random, time, requests
          out=Path('hockey_sources'); out.mkdir()
          urls=[]
          for y in range(2001,2015):
              urls.append((f'https://hokej.sfrp.cz/ms/ms{y}.html',f'sfrp_{y}.html'))
          for y in (1993,1999,2002):
              urls.append((f'https://www.ishockeytabeller.se/roster-vm-{y}',f'ishockey_{y}.html'))
          def get(item):
              url,name=item
              s=requests.Session(); s.headers.update({'User-Agent':'HockeyWorldsDatasetResearch/0.2 (factual historical research)','Accept-Language':'en-US,en;q=0.9,sv;q=0.8'})
              last=''
              for a in range(1,5):
                  try:
                      r=s.get(url,timeout=(12,90),allow_redirects=True)
                      if r.status_code==200 and len(r.content)>500:
                          (out/name).write_bytes(r.content)
                          return {'name':name,'url':url,'status':'ok','bytes':len(r.content),'attempt':a}
                      last=f'HTTP {r.status_code}, {len(r.content)} bytes'
                  except Exception as e:
                      last=repr(e)
                  time.sleep(a*2+random.random())
              return {'name':name,'url':url,'status':'failed','error':last}
          rows=[]
          with ThreadPoolExecutor(max_workers=4) as ex:
              futs={ex.submit(get,x):x for x in urls}
              for f in as_completed(futs):
                  r=f.result(); rows.append(r); print(json.dumps(r),flush=True)
          (out/'fetch_report.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
          PY
      - name: Upload sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-hockey-sources
          path: hockey_sources/
          if-no-files-found: error
          retention-days: 1
